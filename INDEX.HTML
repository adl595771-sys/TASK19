<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mobile store</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <main class="py-5">
        <div class="container d-flex flex-column gap-5">

            <h1 class="text-center fw-bold text-info">mobile store</h1>
            <form class=" d-flex  gap-2">
                <input class="create input flex-grow-1 form-control " type="text" name="name"
                    placeholder=" mobile name">
                <input class="price input flex-grow-1 form-control" type="number" name="price"
                    placeholder=" mobile price">
                <button class="btn btn-primary px-4" type="submit">create</button>
            </form>
            <table class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>

            </table>

        </div>
    </main>
    <script src="./MAIN.JS"></script>
</body>

</html>
